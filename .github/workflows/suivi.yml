name: Suivi en direct des paris

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      duree:
        description: "Durée du suivi en minutes"
        default: "330"

concurrency:
  group: suivi
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  suivi:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Suivi des scores
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          DUREE_MIN: ${{ github.event.inputs.duree || '60' }}
        run: python suivi_live.py
      - name: Sauvegarde de l'état
        run: |
          git config user.name "bot-paris"
          git config user.email "bot-paris@users.noreply.github.com"
          git add etat.json
          git diff --cached --quiet || (git commit -m "état du suivi" && git push)
